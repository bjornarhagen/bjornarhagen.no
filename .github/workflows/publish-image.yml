name: Publish container image

# This repository is public, so workflow logs are world readable and the
# published package inherits public visibility. Nothing secret may be echoed
# here, and the trigger is deliberately limited to pushes on this repository's
# own dev branch. pull_request is not a trigger, so a fork cannot run this
# workflow with access to packages: write.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # core-01 is x86. Stated explicitly so the image stays correct if the
          # runner architecture ever changes.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      # Values are passed through env rather than interpolated into the script.
      # Interpolating an expression directly into run: is a script injection
      # vector, and this repository is public.
      - name: Report immutable digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Image: \`${IMAGE}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Reference this digest in the ai-devops repository."
          } >> "$GITHUB_STEP_SUMMARY"
